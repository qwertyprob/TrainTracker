name: Docker Compose CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    env:
      # Переменные для фронтенда и бэкенда
      NEXT_PUBLIC_API_URL: http://backend:8080/api
      DATABASE_URL: mysql://tracker:trackerpass@mariadb:3306/traintrackerdb

    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: traintrackerdb
          MYSQL_USER: tracker
          MYSQL_PASSWORD: trackerpass
        ports:
          - 3306:3306

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Необязательный шаг для DockerHub login
      - name: Log in to DockerHub (optional)
        run: echo "Skipping DockerHub login for CI build"

      - name: Build backend image
        run: docker build -t train-api-container ./apps/backend

      - name: Build frontend image
        run: docker build --build-arg NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }} -t train-frontend ./apps/client

      - name: Start services with Docker Compose
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for MariaDB
        run: |
          echo "Waiting for MariaDB to be ready..."
          sleep 20

      - name: Run backend tests (optional)
        run: |
          echo "Here you can run integration tests or API checks"
          # curl http://localhost:8080/api/train

      - name: Tear down services
        if: always()
        run: docker compose down -v
